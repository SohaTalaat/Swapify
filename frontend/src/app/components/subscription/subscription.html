<div class="container py-5">
  <h2 class="text-center mb-4 fw-bold text-primary">Choose Your Subscription</h2>

  <div class="row justify-content-center g-4">
    <div class="col-md-4" *ngFor="let plan of plans">
      <div
        class="card shadow-lg border-0 rounded-4 p-4 text-center h-100"
        [ngClass]="{ 'border-primary': selectedPlan === plan.name }"
      >
        <h4 class="fw-bold text-dark mb-2">{{ plan.name }}</h4>
        <h3 class="fw-bold text-primary">${{ plan.price }}</h3>
        <p class="text-muted mb-4">Up to {{ plan.barters }} barters / month</p>

        <button
          *ngIf="plan.price === 0"
          class="btn btn-success w-100 fw-semibold"
          (click)="subscribe(plan, 'manual')"
          [disabled]="loading"
        >
          Activate Free Plan
        </button>

        <div *ngIf="plan.price > 0" class="d-flex flex-column gap-2">
          <button
            class="btn btn-outline-primary fw-semibold"
            (click)="subscribe(plan, 'card')"
            [disabled]="loading"
          >
            💳 Pay with Card
          </button>

          <button
            class="btn btn-primary fw-semibold"
            (click)="openWalletModal(plan)"
            [disabled]="loading"
          >
            📱 Pay with Wallet
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 🌟 Wallet Modal -->
<div
  class="modal fade"
  id="walletModal"
  tabindex="-1"
  aria-labelledby="walletModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-3 border-0 shadow-lg rounded-4">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-bold text-primary" id="walletModalLabel">Enter Wallet Number</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body">
        <p class="text-muted mb-3">
          Please enter your mobile wallet number (e.g., Vodafone Cash or Etisalat Cash).
        </p>
        <input
          type="text"
          class="form-control form-control-lg"
          placeholder="01xxxxxxxxx"
          [(ngModel)]="walletNumber"
          maxlength="11"
        />
      </div>

      <div class="modal-footer border-0">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary" (click)="confirmWalletPayment()">
          Confirm & Pay
        </button>
      </div>
    </div>
  </div>
</div>
