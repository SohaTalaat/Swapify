<div class="subscription-container container py-5">
  <h2 class="text-center mb-5 fw-bold text-primary">Choose Your Plan</h2>

  <div class="row justify-content-center g-4">
    <div class="col-md-4" *ngFor="let plan of plans">
      <div class="card plan-card shadow-lg border-0 h-100">
        <div class="card-body d-flex flex-column justify-content-between text-center">
          <div>
            <h4 class="fw-bold text-uppercase mb-3">{{ plan.name }}</h4>
            <h1 class="display-6 fw-bold" [style.color]="'#ee6931'">
              {{ plan.price === 0 ? 'Free' : '$' + plan.price }}
            </h1>
            <p class="text-muted">{{ plan.barters }} barters / month</p>
          </div>

          <div class="mt-3">
            <!-- Free plan -->
            <button
              *ngIf="plan.price === 0"
              class="btn btn-primary-custom w-100"
              (click)="subscribe(plan)"
              [disabled]="loading"
            >
              {{ loading ? 'Processing...' : 'Activate Free' }}
            </button>

            <!-- Paid plans -->
            <div *ngIf="plan.price > 0" class="d-flex flex-column gap-2">
              <button
                class="btn btn-primary-custom w-100"
                (click)="subscribe(plan, 'card')"
                [disabled]="loading"
              >
                💳 Pay with Card
              </button>

              <button
                class="btn btn-outline-custom w-100"
                (click)="subscribe(plan, 'wallet')"
                [disabled]="loading"
              >
                📱 Pay with Wallet
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
