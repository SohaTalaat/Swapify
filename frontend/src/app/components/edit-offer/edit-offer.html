<div class="edit-offer-page py-5 d-flex justify-content-center">
  <div class="card p-4 shadow form-card w-75" *ngIf="!loading; else loadingTpl">
    <h3 class="text-gradient text-center mb-4">
      <i class="fa-solid fa-pen me-2"></i>Edit Offer #{{ offerId }}
    </h3>

    <form (ngSubmit)="saveChanges()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Title</label>
          <input type="text" class="form-control" [(ngModel)]="offer.title" name="title" required />
        </div>

        <div class="col-md-6 mb-3">
          <label>Category</label>
          <select class="form-select" [(ngModel)]="offer.category_id" name="category_id" required>
            <option value="">Select Category</option>
            <option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label>Description</label>
        <textarea
          class="form-control"
          rows="3"
          [(ngModel)]="offer.description"
          name="description"
        ></textarea>
      </div>

      <div class="mb-3">
        <label>Type</label>
        <select class="form-select" [(ngModel)]="offer.type" name="type">
          <option value="product">Product</option>
          <option value="service">Service</option>
          <option value="request">Request</option>
        </select>
      </div>

      <div class="mb-3">
        <label>What do you want in return?</label>
        <input type="text" class="form-control" [(ngModel)]="offer.want" name="want" />
      </div>

      <!-- ✅ Images -->
      <div class="mb-3">
        <input type="file" (change)="onFileSelected($event)" class="form-control mt-3" />

        <div class="d-flex flex-wrap mt-3">
          <img
            *ngFor="let img of previewImages"
            [src]="img"
            class="me-2 mb-2 rounded"
            style="width: 120px; height: 120px; object-fit: cover"
          />
        </div>
      </div>

      <div class="text-center mt-4">
        <button class="btn btn-gradient w-100" type="submit">
          <i class="fa-solid fa-save me-2"></i>Save Changes
        </button>
      </div>
    </form>
  </div>

  <ng-template #loadingTpl>
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-3">Loading..</p>
    </div>
  </ng-template>
</div>
