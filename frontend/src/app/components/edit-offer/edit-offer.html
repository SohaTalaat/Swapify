<div class="edit-offer-page py-5 d-flex justify-content-center">
  <div class="card p-4 shadow form-card">
    <h3 class="text-gradient text-center mb-4">
      <i class="fa-solid fa-pen me-2"></i>Edit Offer #{{ offerId }}
    </h3>

    <form (ngSubmit)="saveChanges()">
      <div class="mb-3">
        <label>Title</label>
        <input type="text" class="form-control" [(ngModel)]="offer.title" name="title" />
      </div>

      <div class="mb-3">
        <label>Description</label>
        <textarea
          class="form-control"
          rows="3"
          [(ngModel)]="offer.description"
          name="description"
        ></textarea>
      </div>

      <div class="mb-3">
        <label>What do you want in return?</label>
        <input type="text" class="form-control" [(ngModel)]="offer.want" name="want" />
      </div>

      <div class="text-center">
        <button class="btn btn-gradient w-100" type="submit">
          <i class="fa-solid fa-save me-2"></i>Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
