<!-- Hero Section -->
<div
  class="faq-hero d-flex flex-column justify-content-center align-items-center text-center text-white"
>
  <h1 class="fw-bold mb-3 animate-fade">
    <span class="highlight">Frequently Asked Questions</span>
  </h1>
  <p class="lead animate-fade delay-1">
    Find quick answers about how Swapify works and start bartering today!
  </p>
</div>

<!-- FAQ Section -->
<div class="faq-section py-5">
  <div class="container">
    <div class="row align-items-center g-5">
      <!-- Right Accordion -->
      <div class="col-md-7 animate-fade">
        <div class="accordion glass-card shadow-sm" id="faqAccordion">
          <div class="accordion-item" *ngFor="let q of faqs; let i = index">
            <h2 class="accordion-header" id="heading{{ i }}">
              <button
                class="accordion-button collapsed"
                type="button"
                data-bs-toggle="collapse"
                [attr.data-bs-target]="'#collapse' + i"
              >
                <i class="fa-solid fa-circle-question me-2 text-warning"></i>
                {{ q.question }}
              </button>
            </h2>
            <div
              [id]="'collapse' + i"
              class="accordion-collapse collapse"
              [attr.aria-labelledby]="'heading' + i"
              data-bs-parent="#faqAccordion"
            >
              <div class="accordion-body">
                {{ q.answer }}
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Left Image -->
      <div class="col-md-5 text-center animate-slide">
        <img src="assets/faq.png" alt="FAQ" class="img-fluid faq-img" />
      </div>
    </div>
  </div>
</div>
