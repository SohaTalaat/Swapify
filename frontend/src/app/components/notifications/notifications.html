<!-- Hero Section -->
<div class="notifications-hero text-center text-white py-5">
  <h1 class="fw-bold animate-fade"><i class="fa-solid fa-bell me-2"></i> Notifications</h1>
  <p class="lead animate-fade delay-1">Stay updated with your latest barters and offers</p>
</div>

<!-- Notifications List -->
<div class="notifications-container py-5">
  <div class="container">
    <div class="card shadow-sm p-4 notification-card">
      <!-- Loading -->
      <div *ngIf="loading" class="text-center text-muted py-3">Loading notifications...</div>

      <!-- No notifications -->
      <div *ngIf="!loading && notifications.length === 0" class="text-center text-muted py-3">
        No notifications yet.
      </div>

      <!-- Notifications -->
      <div
        *ngFor="let n of notifications"
        class="notification-item d-flex justify-content-between align-items-center mb-3 p-3"
        [class.unread]="!n.read"
      >
        <div class="d-flex align-items-center">
          <i
            class="fa-solid"
            [ngClass]="{
              'fa-handshake text-success': n.type === 'barter_status',
              'fa-tag text-primary': n.type === 'offer',
              'fa-message text-warning': n.type === 'message',
              'fa-exclamation-circle text-danger': n.type === 'dispute'
            }"
          ></i>
          <div class="ms-3">
            <p class="mb-1 fw-semibold">{{ n.title }}</p>
            <small class="text-muted">{{ n.time }}</small>
          </div>
        </div>

        <button *ngIf="!n.read" class="btn btn-sm btn-outline-primary" (click)="markAsRead(n)">
          Mark as Read
        </button>
      </div>
    </div>
  </div>
</div>
