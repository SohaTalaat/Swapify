<link
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  rel="stylesheet"
/>

<div class="container profile-page">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-lg-3 col-md-4 col-12 mb-4">
      <div class="profile-sidebar">
        <div class="user-heading text-center">
          <img
            [src]="userData.profile_picture_url || 'assets/avatar.png'"
            alt="Profile Picture"
            class="avatar"
          />
          <h4 class="mt-2">
            {{ userData.full_name }}
            <i
              *ngIf="userData.is_id_verified"
              class="fa-solid fa-circle-check ms-2"
              style="color: #ed5b2b"
              title="موثق"
            ></i>
          </h4>
          <p>{{ userData.email }}</p>
          <p>{{ userData.phone }}</p>
        </div>

        <ul class="nav flex-column mt-3">
          <li>
            <a class="active" href="#"><i class="fa fa-user"></i> Profile</a>
          </li>
          <li>
            <a routerLink="/update-profile"><i class="fa fa-edit"></i> Edit Profile</a>
          </li>
          <li>
            <a routerLink="/id-verification"
              ><i class="fa-solid fa-id-card"></i> Verification Account</a
            >
          </li>
          <li>
            <a routerLink="/my-barters"><i class="fa fa-calendar"></i> My Barters</a>
          </li>
          <li>
            <a routerLink="/my-reviews"><i class="fa fa-star"></i> My Reviews</a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Profile Info -->
    <div class="col-lg-9 col-md-8 col-12">
      <div class="profile-info">
        <div class="bio-section p-4 shadow-sm rounded mb-4">
          <h5 class="fw-bold text-gradient mb-3">About</h5>
          <p class="bio-text">{{ userData.bio }}</p>

          <div class="row mt-3">
            <div class="col-md-4 mb-2">
              <i class="fa-solid fa-envelope me-2 text-danger"></i>
              {{ userData.email }}
            </div>
            <div class="col-md-4 mb-2">
              <i class="fa-solid fa-location-dot me-2 text-danger"></i>
              {{ userData.location }}
            </div>
            <div class="col-md-4 mb-2">
              <i class="fa-solid fa-phone me-2 text-danger"></i>
              {{ userData.phone }}
            </div>
          </div>
        </div>

        <!-- Shopping Cart -->
        <div class="shopping-cart shadow-sm rounded p-4">
          <app-my-offers></app-my-offers>
          <app-recommendations></app-recommendations>
        </div>
      </div>
    </div>
  </div>
</div>
