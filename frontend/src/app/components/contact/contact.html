<div class="container mt-5">
  <div class="card shadow-lg p-5 rounded-4 border-0" style="background: #fff8f2">
    <h1 class="text-center mb-4" style="color: #f76527">Contact Us</h1>
    <form>
      <div class="mb-3">
        <label class="form-label fw-semibold">Name</label>
        <input type="text" class="form-control rounded-3" placeholder="Your Name" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control rounded-3" placeholder="you@example.com" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Message</label>
        <textarea
          class="form-control rounded-3"
          rows="4"
          placeholder="Type your message"
        ></textarea>
      </div>
      <button type="submit" class="btn w-100 text-white" style="background: #f76527">
        Send Message
      </button>
    </form>
  </div>
</div>
