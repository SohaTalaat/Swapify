<div class="contact-page py-5">
  <div class="container">
    <h2 class="text-center mb-4">Contact Us</h2>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card p-4 shadow">
          <form>
            <div class="mb-3">
              <label>Name</label>
              <input type="text" class="form-control" placeholder="Your name" />
            </div>
            <div class="mb-3">
              <label>Email</label>
              <input type="email" class="form-control" placeholder="Your email" />
            </div>
            <div class="mb-3">
              <label>Message</label>
              <textarea
                class="form-control"
                rows="4"
                placeholder="Write your message..."
              ></textarea>
            </div>
            <button class="btn w-100" style="background-color: #ee6931; color: white">
              Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
