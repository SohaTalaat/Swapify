<!-- src/app/components/my-barters/my-barters.html -->
<div class="barters-hero text-center text-white py-5">
  <h1 class="fw-bold">My Barters</h1>
  <p class="lead">Track your ongoing and completed exchanges</p>
</div>

<div class="container py-5">
  <!-- Loading Spinner -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- No Barters -->
  <div *ngIf="!isLoading && barters.length === 0" class="text-center py-5">
    <p class="text-muted">
      You have no barters yet. <a routerLink="/start-barter">Start one now!</a>
    </p>
  </div>

  <!-- Barters List -->
  <div class="row g-4" *ngIf="!isLoading && barters.length > 0">
    <div class="col-md-6 col-lg-4" *ngFor="let b of barters">
      <div class="barter-card shadow-sm p-4 d-flex flex-column h-100">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h5 class="fw-bold mb-1 flex-grow-1 me-2">
            {{ b.title }}
          </h5>
          <span
            class="badge fs-6"
            [ngClass]="{
              'bg-success': b.status === 'Completed',
              'bg-warning text-dark': b.status === 'Ongoing' || b.status === 'In Transit',
              'bg-secondary': b.status === 'Pending',
              'bg-danger': b.status === 'Cancelled' || b.status === 'Disputed'
            }"
          >
            {{ b.status }}
          </span>
        </div>

        <p class="text-muted small mb-2">
          With: <strong>{{ b.partner }}</strong>
        </p>
        <p class="text-muted small mb-3">Started: {{ b.date }}</p>

        <button class="btn btn-gradient mt-auto" (click)="viewDetails(b.id)">View Details</button>
      </div>
    </div>
  </div>
</div>
