<div class="offers-page py-5">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold text-gradient"><i class="fa-solid fa-tags me-2"></i>My Offers</h2>
      <button class="btn btn-gradient" (click)="createOffer()">
        <i class="fa-solid fa-plus me-2"></i>New Offer
      </button>
    </div>

    <div class="row g-4">
      <div class="col-md-4" *ngFor="let offer of offers">
        <div class="offer-card shadow-sm">
          <img [src]="offer.image" class="offer-img" alt="Offer" />
          <div class="p-3">
            <h5 class="fw-bold">{{ offer.title }}</h5>
            <p class="text-muted small">{{ offer.type }}</p>
            <span
              [class]="
                offer.status === 'Active'
                  ? 'badge bg-success'
                  : offer.status === 'Pending'
                  ? 'badge bg-warning text-dark'
                  : 'badge bg-danger'
              "
              >{{ offer.status }}</span
            >

            <div class="mt-3 d-flex justify-content-between">
              <button class="btn btn-sm btn-outline-secondary" (click)="editOffer(offer.id)">
                <i class="fa-solid fa-pen me-1"></i>Edit
              </button>
              <button class="btn btn-sm btn-outline-danger">
                <i class="fa-solid fa-trash me-1"></i>Delete
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
