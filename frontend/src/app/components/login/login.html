<div class="d-flex justify-content-center align-items-center flex-column form">
  <!-- 🧾 Login Form -->
  <div class="card p-4 formcard" *ngIf="!successMessage() && !errorMessage()">
    <h4 class="text-center mb-3">Login</h4>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label>Email</label>
        <input
          type="email"
          class="form-control"
          placeholder="Enter email"
          formControlName="email"
        />
        <div class="error" *ngIf="getField('email')?.touched && getField('email')?.invalid">
          <small *ngIf="getField('email')?.errors?.['required']">Email is required</small>
          <small *ngIf="getField('email')?.errors?.['email']">Enter a valid email</small>
        </div>
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input
          type="password"
          class="form-control"
          placeholder="Enter password"
          formControlName="password"
        />
        <div class="error" *ngIf="getField('password')?.touched && getField('password')?.invalid">
          <small *ngIf="getField('password')?.errors?.['required']">Password is required</small>
          <small *ngIf="getField('password')?.errors?.['minlength']">
            Password must be at least 6 characters
          </small>
        </div>
      </div>

      <div class="text-end mb-3">
        <a routerLink="/forgot-password" style="color: black; font-size: 0.9rem">
          Forgot your password?
        </a>
      </div>

      <button type="submit" class="btn w-100" style="background-color: #ee6931; color: white">
        Login
      </button>

      <p class="text-center mt-3">
        Don’t have an account?
        <a routerLink="/register" style="color: #ee6931">Register</a>
      </p>
    </form>

    <hr />

    <div class="text-center">
      <p>Login with Google</p>
      <button class="btn google-btn">
        <i class="fa-brands fa-google"></i>
      </button>
    </div>
  </div>

  <!-- ✅ Success Box -->
  <div class="message-box success" *ngIf="successMessage()">
    <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
    <p>{{ successMessage() }}</p>
    <button class="btn back-btn mt-3" (click)="backToLogin()">🔙 Back to Login</button>
  </div>

  <!-- ❌ Error Box -->
  <div class="message-box error" *ngIf="errorMessage()">
    <div class="icon"><i class="fa-solid fa-circle-xmark"></i></div>
    <p>{{ errorMessage() }}</p>
    <button class="btn back-btn mt-3" (click)="backToLogin()">🔙 Back to Login</button>
  </div>
</div>
