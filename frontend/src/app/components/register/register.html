<div class="d-flex justify-content-center align-items-center flex-column form">
  <!-- ✅ نموذج التسجيل -->
  <div class="card p-4 formcard" *ngIf="!successMessage() && !errorMessage()">
    <h4 class="text-center mb-3">Create Account</h4>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- USERNAME -->
      <div class="mb-3">
        <label>User Name</label>
        <input
          type="text"
          class="form-control"
          placeholder="Your name"
          formControlName="username"
        />
        <div class="error" *ngIf="getField('username')?.touched && getField('username')?.invalid">
          <small *ngIf="getField('username')?.errors?.['required']">Username is required</small>
          <small *ngIf="getField('username')?.errors?.['minlength']">
            Username must be at least 3 characters
          </small>
        </div>
      </div>

      <!-- EMAIL -->
      <div class="mb-3">
        <label>Email</label>
        <input type="email" class="form-control" placeholder="Your email" formControlName="email" />
        <div class="error" *ngIf="getField('email')?.touched && getField('email')?.invalid">
          <small *ngIf="getField('email')?.errors?.['required']">Email is required</small>
          <small *ngIf="getField('email')?.errors?.['email']">Please enter a valid email</small>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="mb-3">
        <label>Password</label>
        <input
          type="password"
          class="form-control"
          placeholder="Create password"
          formControlName="password"
        />
        <div class="error" *ngIf="getField('password')?.touched && getField('password')?.invalid">
          <small *ngIf="getField('password')?.errors?.['required']">Password is required</small>
          <small *ngIf="getField('password')?.errors?.['minlength']">
            Password must be at least 6 characters
          </small>
        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="mb-3">
        <label>Confirm Password</label>
        <input
          type="password"
          class="form-control"
          placeholder="Re-write password"
          formControlName="password_confirmation"
        />
        <div
          class="error"
          *ngIf="
            getField('password_confirmation')?.touched && getField('password_confirmation')?.invalid
          "
        >
          <small *ngIf="getField('password_confirmation')?.errors?.['required']">
            Confirmation is required
          </small>
        </div>
      </div>

      <button type="submit" class="btn w-100" style="background-color: #ee6931; color: white">
        Register
      </button>

      <p class="text-center mt-3">Already have an account? <a routerLink="/login">Login</a></p>
    </form>
  </div>

  <!-- ✅ Success Box -->
  <div class="message-box success" *ngIf="successMessage()">
    <div class="icon"><i class="fa-solid fa-circle-check"></i></div>
    <p>{{ successMessage() }}</p>
    <button class="btn back-btn mt-3" (click)="backToRegister()">🔙 Back to Register</button>
  </div>

  <!-- ❌ Error Box -->
  <div class="message-box error" *ngIf="errorMessage()">
    <div class="icon"><i class="fa-solid fa-circle-xmark"></i></div>
    <p>{{ errorMessage() }}</p>
    <button class="btn back-btn mt-3" (click)="backToRegister()">🔙 Back to Register</button>
  </div>
</div>
