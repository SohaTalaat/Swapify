<div class="barter-details py-5">
  <div class="container">
    <h2 class="fw-bold mb-4 text-center text-gradient">🤝 Barter Details</h2>

    <!-- 🌀 Loading -->
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- ✅ Content -->
    <div *ngIf="!isLoading && viewModel">
      <div class="row g-4">
        <!-- 🟦 Your Offer -->
        <div class="col-md-6">
          <div class="card offer-card shadow-sm">
            <h5 class="text-primary mb-3 border-bottom pb-2">Your Offer</h5>
            <div class="image-container">
              <img [src]="viewModel.yourOffer.image" class="offer-image" alt="Your offer" />
            </div>
            <p class="fw-semibold text-center mt-3">{{ viewModel.yourOffer.title }}</p>
          </div>
        </div>

        <!-- 🟩 Partner's Offer -->
        <div class="col-md-6">
          <div class="card offer-card shadow-sm">
            <h5 class="text-success mb-3 border-bottom pb-2">Offer from {{ viewModel.partner }}</h5>
            <div class="image-container">
              <img [src]="viewModel.partnerOffer.image" class="offer-image" alt="Partner offer" />
            </div>
            <p class="fw-semibold text-center mt-3">{{ viewModel.partnerOffer.title }}</p>
          </div>
        </div>
      </div>

      <!-- 🔵 Status -->
      <div class="status mt-4 text-center">
        <span
          class="badge fs-5 px-4 py-2 status-badge"
          [ngClass]="{
            'bg-success': viewModel.status === 'Completed',
            'bg-warning text-dark':
              viewModel.status === 'Ongoing' || viewModel.status === 'In Transit',
            'bg-secondary': viewModel.status === 'Pending',
            'bg-danger': viewModel.status === 'Cancelled' || viewModel.status === 'Disputed'
          }"
        >
          {{ viewModel.status }}
        </span>
        <!-- 🟢 الأزرار الديناميكية -->
        <!-- 🔴 يظهر فقط للـ offering -->
        <div
          class="text-center mt-4"
          *ngIf="viewModel.role === 'offering' && viewModel.status === 'Pending'"
        >
          <button class="btn btn-danger" (click)="deleteBarter()">Cancel</button>
        </div>

        <!-- 🟢 يظهر فقط للـ requesting -->
        <div
          class="text-center mt-4"
          *ngIf="viewModel.role === 'requesting' && viewModel.status === 'Pending'"
        >
          <button class="btn btn-gradient me-2" (click)="updateStatus('Ongoing')">Accept</button>
          <button class="btn btn-danger" (click)="updateStatus('Cancelled')">Reject</button>
        </div>

        <!-- 💬 Chat Section -->
        <div class="chat-section mt-5">
          <h5 class="mb-3 fw-semibold text-gradient">💬 Messages</h5>
          <div class="chat-box p-3 mb-3 shadow-sm">
            <div
              *ngFor="let msg of viewModel.messages"
              class="mb-3 d-flex"
              [ngClass]="msg.sender === 'You' ? 'justify-content-end' : 'justify-content-start'"
            >
              <div class="chat-bubble" [ngClass]="msg.sender === 'You' ? 'me' : 'partner'">
                <small class="d-block fw-bold mb-1">{{ msg.sender }}</small>
                <span>{{ msg.text }}</span>
                <small class="d-block text-end opacity-75 mt-1">{{ msg.time }}</small>
              </div>
            </div>
          </div>

          <!-- ✏️ Input -->
          <div class="input-group">
            <input
              type="text"
              class="form-control rounded-start-pill"
              placeholder="Type a message..."
              [(ngModel)]="newMessage"
              (keydown.enter)="sendMessage()"
            />
            <button
              class="btn btn-gradient rounded-end-pill px-4"
              (click)="sendMessage()"
              [disabled]="!newMessage.trim()"
            >
              Send
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
