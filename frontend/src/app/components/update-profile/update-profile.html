<div class="update-profile-container">
  <h2>Update Your Profile</h2>

  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" [(ngModel)]="full_name" name="full_name" />
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" [(ngModel)]="phone" name="phone" />
    </div>

    <div class="form-group">
      <label>City / Location</label>
      <input type="text" [(ngModel)]="location" name="location" />
    </div>

    <div class="form-group">
      <label>Bio</label>
      <textarea [(ngModel)]="bio" name="bio" rows="3"></textarea>
    </div>

    <div class="form-group">
      <label>Profile Picture</label>
      <input type="file" (change)="onFileSelected($event)" />
      <div class="preview" *ngIf="imagePreview">
        <img [src]="imagePreview" alt="Profile Preview" />
      </div>
    </div>

    <button type="submit" class="btn-save">Save Changes</button>
  </form>
</div>
