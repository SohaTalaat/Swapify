<!-- ✅ Hero Carousel -->
<section id="hero" class="hero-section">
  <div id="heroCarousel" class="carousel slide carousel-fade" data-bs-ride="carousel">
    <div class="carousel-inner">
      <!-- Slide 1 -->
      <div class="carousel-item active" style="background-image: url('assets/p12.png')">
        <div class="overlay"></div>
        <div class="carousel-content text-center text-white">
          <h1 class="display-4 fw-bold">Swap with <span class="text-gradient">Swapify</span></h1>
          <p class="lead mb-4">Exchange items and services easily — no money, just value.</p>
          <a routerLink="/register" class="btn-hero btn-orange"> Get Started</a>
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="carousel-item" style="background-image: url('assets/p22.png')">
        <div class="overlay"></div>
        <div class="carousel-content text-center text-white">
          <h1 class="display-4 fw-bold">Find What You Need</h1>
          <p class="lead mb-4">Discover new offers and make the perfect trade.</p>
          <a routerLink="/offers" class="btn-hero btn-outline"> Browse Offers</a>
        </div>
      </div>

      <!-- Slide 3 -->
      <div class="carousel-item" style="background-image: url('assets/p32.png')">
        <div class="overlay"></div>
        <div class="carousel-content text-center text-white">
          <h1 class="display-4 fw-bold">Connect. Trade. Enjoy.</h1>
          <p class="lead mb-4">Join a trusted community built on fair exchange.</p>
          <a routerLink="/about" class="btn-hero btn-orange">Learn More</a>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#heroCarousel"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#heroCarousel"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</section>

<app-subscription></app-subscription>
