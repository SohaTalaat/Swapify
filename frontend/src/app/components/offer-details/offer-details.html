<div class="offer-details py-5" *ngIf="!loading && offer; else loadingTpl">
  <div class="container">
    <div class="row align-items-center g-5">
      <!-- Left: Image -->
      <div class="col-md-6 text-center">
        <img [src]="offer.image" alt="{{ offer.title }}" class="img-fluid offer-img" />
      </div>

      <!-- Right: Info -->
      <div class="col-md-6">
        <h2 class="fw-bold text-gradient mb-3">{{ offer.title }}</h2>
        <p class="text-muted"><i class="fa-solid fa-user me-2 text-primary"></i>{{ offer.user }}</p>
        <p><strong>Category:</strong> {{ offer.category }}</p>
        <p><strong>Location:</strong> {{ offer.location }}</p>
        <p><strong>Wants:</strong> {{ offer.want }}</p>

        <hr />
        <p>{{ offer.description }}</p>

        <div class="mt-4">
          <button class="btn btn-gradient me-2">
            <a routerLink="/start-barter" style="text-decoration: none; color: white">
              <i class="fa-solid fa-handshake me-2"></i>Start Barter</a
            >
          </button>
          <!-- <button class="btn btn-outline-secondary">
            <i class="fa-solid fa-comment-dots me-2"></i>Message Owner
          </button> -->
          <!-- زر الإبلاغ عن العرض -->
          <div class="mt-3">
            <button class="btn btn-outline-danger" (click)="showReportForm = true">
              <i class="fa-solid fa-flag me-2"></i>Report Offer
            </button>
          </div>

          <!-- نموذج كتابة سبب الإبلاغ -->
          <div *ngIf="showReportForm" class="mt-3 p-3 border rounded bg-light">
            <h5>Report this offer</h5>
            <textarea
              class="form-control mb-2"
              rows="3"
              placeholder="Enter reason..."
              [(ngModel)]="reportReason"
            ></textarea>
            <button class="btn btn-danger me-2" (click)="submitReport()">Submit</button>
            <button class="btn btn-secondary" (click)="showReportForm = false">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Loading Template -->
<ng-template #loadingTpl>
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="mt-3">Loading offer details...</p>
  </div>
</ng-template>
